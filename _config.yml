# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Hung D. Nguyen
name: Hung D. Nguyen
position: Ph.D. Candidate, KAIST
email: hungnd@kaist.ac.kr
description: |
  I'm currently a Ph.D. candidate at the [Coding and Communications Laboratory](https://cocoa.kaist.ac.kr/index.html), KAIST, under the supervision of Professor [Jeongseok Ha](https://cocoa.kaist.ac.kr/members1.html). My research interests lie in wireless communications, with a focus on non-terrestrial networks, physical layer security, and covert communications. 
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://hungduy15499.github.io" # the base hostname & protocol for your site, e.g. http://example.com
researchgate: "https://www.researchgate.net/profile/Hung-Nguyen-709"
cv_url: "https://drive.google.com/file/d/1falcSq5ZvPXa4lBWqBVGGHXnWr2-Skm0/view"
portrait: portrait.jpg   # photo in images/ (4:5 ratio). Leave empty to hide.

# Publications are read from bib/papers.bib.
# Your name in BibTeX ("Nguyen, Hung D.") is detected and shown in bold as `me_display`.
me_first: "Hung D."
me_last: "Nguyen"
me_display: "Hung D. Nguyen"
github_username: hungduy15499
google_scholar: Ac0Z2XQAAAAJ
google_analytics: 

# Build settings
plugins:
  - jekyll-feed
  - jekyll-tailwindcss


# Blog settings
permalink: /blog/:year/:month/:day/:title/
excerpt_separator: <!--more-->

defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
      math: false

