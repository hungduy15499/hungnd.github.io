# Bio (Markdown allowed: [text](link), **bold**, *italic*)
bio: |
  Hi, my name is Hung, and I'm from Vietnam. I'm currently a Ph.D. candidate at the
  [Coding and Communications Laboratory (CoCoA)](https://cocoa.kaist.ac.kr/index.html), KAIST,
  under the supervision of Professor [Jeongseok Ha](https://cocoa.kaist.ac.kr/members1.html).
  My research interests lie in wireless communications, with a focus on non-terrestrial networks,
  physical layer security, and covert communications.
