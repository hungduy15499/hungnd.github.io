# Bio — shown right under your name (Markdown allowed: [text](link), **bold**)
bio: |
  I'm a Ph.D. candidate in the School of Electrical Engineering at the Korea Advanced Institute of Science and Technology (KAIST).
  I work in the [Coding and Communications Laboratory](https://cocoa.kaist.ac.kr/index.html) under the supervision of
  Prof. [Jeongseok Ha](https://cocoa.kaist.ac.kr/members1.html).
  Prior to that, I received my B.S. degree (Talented Program) in Electronics and Telecommunications Engineering from
  Hanoi University of Science and Technology (HUST), Vietnam.
  During my time at HUST, I worked as a research intern at [CTARG](https://sites.google.com/site/ntchuyenkyoto/lab?authuser=0)
  under the supervision of Prof. [Chuyen T. Nguyen](https://sites.google.com/site/ntchuyenkyoto/home?authuser=0).
